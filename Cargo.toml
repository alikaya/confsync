[workspace]
resolver = "2"
members = ["crates/confsync-core", "crates/confsync-gui", "crates/confsync-agent"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/alikaya/confsync"

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
walkdir = "2"
libc = "0.2"
ignore = "0.4"
git2 = { version = "0.18", default-features = false, features = ["https", "ssh"] }
sha2 = "0.10"
dirs = "5"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
gethostname = "0.4"
log = "0.4"
env_logger = "0.11"
